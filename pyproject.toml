[project]
name = "safecpp-reviewer"
version = "0.1.0"
description = "Agentic LLM system for embedded C++ safety review (MISRA / AUTOSAR / cppcoreguidelines)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "abumahdi" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "openai>=1.40.0",
    "requests",
    "path",
    "tree-sitter>=0.25.2",
    "tree-sitter-cpp>=0.23.4",
    "pyyaml>=6.0.3",
    "langgraph>=1.1.10",
    "langchain-core>=1.3.2",
    "types-pyyaml>=6.0.12.20260408",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.12",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
safecpp = "safecpp_reviewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safecpp_reviewer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "monkeytype>=23.3.0",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.hatch.build.targets.wheel.force-include]
"src/safecpp_reviewer/knowledge/data" = "safecpp_reviewer/knowledge/data"
